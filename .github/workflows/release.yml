name: Build and release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 這個 repo 目前沒有 gradle wrapper，所以明確指定 Gradle 版本，
      # 不要用 runner 預裝的（版本太舊，AGP 9 需要 Gradle 9.x）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      # 純 JVM 單元測試（app/src/test），不需要模擬器。涵蓋座標轉換、
      # 穩定度判斷、版本比對、單字清單編解碼這些有明確對錯答案的邏輯；
      # 相機/ML Kit 辨識/Gemini Nano/TTS 這些吃真實硬體的東西測不到，
      # 那些還是得在實機上驗證。
      - name: Run unit tests
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          gradle testDebugUnitTest 2>&1 | tee /tmp/test.log

      - name: Report test failure
        if: steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -v $'^\tat ' /tmp/test.log \
            | grep -v '^Caused by: org.gradle' \
            | tail -c 6000 > /tmp/filtered-test.log
          {
            echo '```'
            cat /tmp/filtered-test.log
            echo '```'
          } > /tmp/issue-body.md
          gh issue create \
            --title "CI 單元測試失敗 (run ${{ github.run_number }})" \
            --body-file /tmp/issue-body.md
          exit 1

      - name: Compute version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        id: build
        continue-on-error: true
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee /tmp/build.log

      # 建置失敗時把 log 尾段開成 issue，方便在沙箱裡透過 API 讀到錯誤原因
      - name: Report build failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 濾掉 stack trace 的 "at ..." 行，否則真正的錯誤訊息會被洗掉
          grep -v $'^\tat ' /tmp/build.log \
            | grep -v '^Caused by: org.gradle' \
            | tail -c 6000 > /tmp/filtered.log
          {
            echo '```'
            cat /tmp/filtered.log
            echo '```'
          } > /tmp/issue-body.md
          gh issue create \
            --title "CI 建置失敗 (run ${{ github.run_number }})" \
            --body-file /tmp/issue-body.md
          exit 1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.version.outputs.code }}
          name: v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
